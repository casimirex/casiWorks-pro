name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, e2e, performance (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Browser checks: ubuntu-latest has Google Chrome installed
      - run: npm run e2e
      - name: Performance budgets (perf-budgets.json)
        run: npm run perf
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-node-${{ matrix.node }}
          path: |
            perf-results.json
            e2e-output/
          if-no-files-found: ignore
